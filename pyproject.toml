[project]
name = "galactic-racer-trainer"
version = "1.4.2"
description = "STAR WARS: Galactic Racer Trainer — modular Python toolkit (educational)"
requires-python = ">=3.10"
authors = [{ name = "grt-community" }]
dependencies = [
  "pymem>=1.12.0",
  "pywin32>=306; sys_platform == 'win32'",
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.9"]
hotkeys = ["keyboard>=0.13.5"]

[project.scripts]
grt = "main:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]